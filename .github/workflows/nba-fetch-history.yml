name: NBA 歷史資料抓取（手動，一次性）

# 抓過去幾季賽果（stats.nba.com leaguegamelog，例行+季後）提交成
# data/nba_hist.csv，供模型訓練與本地回測驗證。免金鑰、不耗 odds-api 額度。
# 注意：stats.nba.com 偶爾擋雲端 IP；失敗就重跑或改天再試。
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "要抓的季（空白分隔，格式 2021-22）"
        default: "2021-22 2022-23 2023-24 2024-25 2025-26"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝套件
        run: pip install -e .

      - name: 抓歷史賽季
        run: |
          args=""
          for s in ${{ inputs.seasons }}; do args="$args --seasons $s"; done
          footy nba fetch-history $args --out data/nba_hist.csv
          wc -l data/nba_hist.csv

      - name: 提交資料
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f data/nba_hist.csv
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git commit -m "data: NBA 歷史賽季 ${{ inputs.seasons }}（nba_hist.csv）[skip ci]" || echo "無變更"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || (git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
