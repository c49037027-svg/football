name: MLB 歷史資料抓取（手動，一次性）

# 抓 2021-2024 四季賽果（不變的歷史）提交成 data/mlb_hist.csv，
# 供本地實驗：長半衰期網格、球場係數/離散度用六季估的驗證。
# statsapi 免費、不耗 odds-api 額度。
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "要抓的季（空白分隔）"
        default: "2021 2022 2023 2024"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝套件
        run: pip install -e .

      - name: 抓歷史賽季
        run: |
          args=""
          for s in ${{ inputs.seasons }}; do args="$args --seasons $s"; done
          footy mlb fetch $args --out data/mlb_hist.csv
          wc -l data/mlb_hist.csv

      - name: 提交資料
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f data/mlb_hist.csv
          git commit -m "data: MLB 歷史賽季 ${{ inputs.seasons }}（mlb_hist.csv）[skip ci]" || echo "無變更"
          git push || echo "推送略過"
