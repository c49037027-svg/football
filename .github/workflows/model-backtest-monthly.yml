# 每月回測回歸：重跑足球走地驗證腳本，上線配置 LL 對基準（0.8276，
# docs/FINDINGS.md「足球走地」節的重現值）漂移 >0.02 即在報告標 WARN——
# 防止後續程式改動悄悄改壞已驗證的行為（改進團隊的「回歸測試員」）。
name: 每月回測回歸（足球走地）

on:
  schedule:
    - cron: "0 8 1 * *"        # 每月 1 日 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安裝套件
        run: pip install -e .
      - name: 重跑走地回測（資料執行期下載）
        run: |
          mkdir -p docs/reports
          out="docs/reports/backtest-$(date -u +%Y-%m).md"
          {
            echo "# 足球走地回測回歸 $(date -u +%Y-%m-%d)"
            echo '```'
            python scripts/backtest_foot_live.py --check-baseline 0.8276 --tolerance 0.02
            echo '```'
          } | tee "$out"
          grep -q "WARN" "$out" && echo "::warning::回測 LL 偏離基準，請查 $out" || true
      - name: 提交報告
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/reports/ || true
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git commit -m "docs: 每月回測回歸報告 [skip ci]" || echo "無變更"
          git push || (git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
