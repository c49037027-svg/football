name: 部署世界盃預測網站

# 觸發：每天 UTC 06:00（台灣 14:00）自動更新；可手動觸發；推送到本分支時也建置
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - claude/football-betting-predictor-y1xity
    paths:
      - "src/footy/**"
      - ".github/workflows/deploy-worldcup.yml"

# GitHub Pages 部署 + 回寫帳本所需權限
permissions:
  contents: write
  pages: write
  id-token: write

# 同時只跑一個部署，新觸發取消進行中的
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝套件
        run: pip install -e .

      - name: 下載國際賽資料並計算 Elo / 訓練模型
        run: |
          footy fetch-intl --out data/intl.csv --since 2010-01-01
          footy train --data data/intl.csv --half-life 540 --use-elo --reg 0.5 --out models/intl.pkl

      - name: 下載最新世界盃賽程與比分
        run: footy fetch-wc --out data/wc2026.json

      - name: MLB 資料 + 投手 + 模型（失敗不中斷）
        run: |
          footy mlb fetch --seasons 2025 --seasons 2026 --out data/mlb.csv || true
          footy mlb fetch-pitchers --season 2026 --out data/mlb_pitchers.csv || true
          test -f data/mlb.csv && footy mlb train || echo "無 MLB 資料，略過訓練"

      - name: AI 連線自我檢查（非必須，失敗不中斷）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: claude-haiku-4-5
        run: footy agent check --live || true

      - name: 產生多頁網站（含 api-football 傷停 + the-odds-api 盤口，失敗自動略過）
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          LLM_MODEL: claude-haiku-4-5
        run: |
          footy wc-site \
            --model models/intl.pkl \
            --schedule data/wc2026.json \
            --history data/intl.csv \
            --outdir out/wc \
            --n-sims 20000 --match-sims 12000 \
            --use-injuries \
            --ledger data/bets.csv

      - name: 天氣接線自我檢查（診斷用，不中斷）
        run: |
          if [ -f out/wc/mlb.html ]; then
            n=$(grep -o '🌤' out/wc/mlb.html | wc -l | tr -d ' ')
            cards=$(grep -o 'card mgame' out/wc/mlb.html | wc -l | tr -d ' ')
            fetched=$(grep -o 'wx:fetched' out/wc/mlb.html | wc -l | tr -d ' ')
            track=$(grep -o 'MLB 推薦戰績' out/wc/mlb.html | wc -l | tr -d ' ')
            top5=$(grep -o 'TOP 5' out/wc/mlb.html | wc -l | tr -d ' ')
            echo "[weather-check] 徽章 ${n} 個 / 比賽卡 ${cards} 張 / 天氣抓到 ${fetched} 場 / 戰績卡 ${track} / TOP5 ${top5}"
            echo "[weather-check] 各場總分係數：$(grep -o 'wxf:[0-9.]*' out/wc/mlb.html | tr '\n' ' ')"
          else
            echo "[weather-check] 無 mlb.html（MLB 未產生）"
          fi

      - name: 天氣探測（診斷用，印各場抓取原因，不中斷）
        env:
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
        run: footy mlb weather-probe || true

      - name: 回寫戰績帳本（每日累積推薦與結算）
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f data/bets.csv data/odds_log.csv || true
          git add -f data/mlb.csv data/mlb_pitchers.csv data/mlb_bets.csv models/mlb.pkl 2>/dev/null || true
          git commit -m "chore: 更新戰績帳本/賠率快照/MLB 資料與模型 [skip ci]" || echo "無變更"
          git push || echo "推送略過"

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/wc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
