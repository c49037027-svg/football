name: 部署世界盃預測網站

# 觸發：每天兩次自動更新——UTC 06:00（台灣 14:00，賽果結算）與
# UTC 16:00（台灣 00:00＝美東中午，此時當天 MLB 盤口已開、比賽未開打，
# 抓得到盤口與 +EV 推薦；只跑一次凌晨場會永遠錯過盤口）；可手動觸發；推送也建置
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - claude/football-betting-predictor-y1xity
    paths:
      - "src/footy/**"
      - ".github/workflows/deploy-worldcup.yml"

# GitHub Pages 部署 + 回寫帳本所需權限
permissions:
  contents: write
  pages: write
  id-token: write

# 同時只跑一個部署，新觸發取消進行中的
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝套件
        run: pip install -e .

      - name: 下載國際賽資料並計算 Elo / 訓練模型
        run: |
          footy fetch-intl --out data/intl.csv --since 2010-01-01
          footy train --data data/intl.csv --half-life 540 --use-elo --reg 0.5 --out models/intl.pkl

      - name: 下載最新世界盃賽程與比分
        run: footy fetch-wc --out data/wc2026.json

      - name: MLB 資料 + 投手 + 模型（失敗不中斷）
        run: |
          footy mlb fetch --seasons 2025 --seasons 2026 --out data/mlb.csv || true
          footy mlb fetch-pitchers --season 2026 --out data/mlb_pitchers.csv || true
          test -f data/mlb.csv && footy mlb train || echo "無 MLB 資料，略過訓練"

      - name: NBA 資料 + 模型（失敗不中斷；休賽季賽程可能為空，靠歷史資料訓練）
        run: |
          footy nba fetch --out data/nba.csv || true
          (test -f data/nba.csv || test -f data/nba_hist.csv) && footy nba train || echo "無 NBA 資料，略過訓練"

      - name: 五大聯賽俱樂部模型（失敗不中斷；空窗期賽程為空、仍靠歷史資料訓練）
        run: |
          for lg in E0 SP1 I1 D1 F1; do
            footy fetch-github --league "$lg" --out "data/club_$lg.csv" || true
          done
          footy leagues-train || echo "無俱樂部資料，略過"

      - name: AI 連線自我檢查（非必須，失敗不中斷）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: claude-haiku-4-5
        run: footy agent check --live || true

      - name: 產生多頁網站（含 api-football 傷停 + the-odds-api 盤口，失敗自動略過）
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          LLM_MODEL: claude-haiku-4-5
          # 靜態站導覽的 🔴走地 需指向 Render 動態站（Repo Variables 設定）
          FOOTY_LIVE_URL: ${{ vars.FOOTY_LIVE_URL || '/live' }}
          # 世界盃結束（2026-07）→ 首頁改 hub、世界盃收 wc.html、導覽換季外版
          FOOTY_WC_OVER: "1"
        run: |
          footy wc-site \
            --model models/intl.pkl \
            --schedule data/wc2026.json \
            --history data/intl.csv \
            --outdir out/wc \
            --n-sims 20000 --match-sims 12000 \
            --use-injuries \
            --ledger data/bets.csv

      - name: 天氣接線自我檢查（診斷用，不中斷）
        run: |
          if [ -f out/wc/mlb.html ]; then
            n=$(grep -o '🌤' out/wc/mlb.html | wc -l | tr -d ' ')
            cards=$(grep -o 'card mgame' out/wc/mlb.html | wc -l | tr -d ' ')
            fetched=$(grep -o 'wx:fetched' out/wc/mlb.html | wc -l | tr -d ' ')
            track=$(grep -o 'MLB 推薦戰績' out/wc/mlb.html | wc -l | tr -d ' ')
            top5=$(grep -o 'TOP 5' out/wc/mlb.html | wc -l | tr -d ' ')
            echo "[weather-check] 徽章 ${n} 個 / 比賽卡 ${cards} 張 / 天氣抓到 ${fetched} 場 / 戰績卡 ${track} / TOP5 ${top5}"
            echo "[weather-check] 各場總分係數：$(grep -o 'wxf:[0-9.]*' out/wc/mlb.html | tr '\n' ' ')"
          else
            echo "[weather-check] 無 mlb.html（MLB 未產生）"
          fi

      - name: the-odds-api 金鑰診斷（0 額度，印剩餘用量；不中斷）
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: footy odds-check || true

      - name: 回寫戰績帳本（每日累積推薦與結算）
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f data/bets.csv data/odds_log.csv || true
          git add -f data/mlb.csv data/mlb_pitchers.csv data/mlb_bets.csv data/mlb_model_bets.csv models/mlb.pkl 2>/dev/null || true
          git add -f data/nba.csv data/nba_bets.csv data/nba_model_bets.csv models/nba.pkl 2>/dev/null || true
          git add -f models/club_*.pkl 2>/dev/null || true
          git commit -m "chore: 更新戰績帳本/賠率快照/MLB 資料與模型 [skip ci]" || echo "無變更"
          git push || echo "推送略過"

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/wc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
